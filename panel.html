<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Otimizador WebP</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    body { padding: 10px; }

    .card {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(24, 24, 27, 0.96);
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }
    .title { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }

    .icon-btn {
      -webkit-app-region: no-drag;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #a1a1aa;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #d4d4d8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    .primary {
      -webkit-app-region: no-drag;
      width: 112px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: #3f3f46;
    }
    .primary:hover { filter: brightness(1.15); }
    .primary.is-off { background: #16a34a; }

    /* ----- tabela do histórico ----- */
    .table-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }
    .table-wrap::-webkit-scrollbar { width: 8px; }
    .table-wrap::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 7px 10px;
      background: #27272a;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    th.num, td.num { width: 92px; text-align: right; font-variant-numeric: tabular-nums; }

    tbody td {
      padding: 6px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr:hover { background: rgba(255, 255, 255, 0.04); }

    .namecell { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .fname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag {
      flex: none;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      font-size: 10px;
    }
    .gain { color: #4ade80; }
    .loss { color: #f87171; }

    .empty { padding: 28px 12px; text-align: center; color: #71717a; font-size: 12px; }
    .empty[hidden] { display: none; }

    .foot { display: flex; align-items: center; justify-content: space-between; }
    .link {
      -webkit-app-region: no-drag;
      border: 0;
      background: transparent;
      color: #71717a;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .link:hover:not(:disabled) { color: #f87171; }
    .link:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="title">Otimizador WebP</span>
      <button id="collapse" class="icon-btn" title="Recolher (Alt+X)" aria-label="Recolher">
        <svg width="16" height="16" viewBox="0 0 64 64">
          <path d="M12 32h40M36 16l16 16-16 16" fill="none" stroke="currentColor"
                stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="bar">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="summary">Ativo · 0 otimizadas</span>
      </div>
      <button id="toggle" class="primary">Desativar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Arquivo</th>
            <th class="num">Original</th>
            <th class="num">Otimizado</th>
            <th class="num">Economia</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty">Nenhuma imagem otimizada ainda.</div>
    </div>

    <div class="foot">
      <button id="clear" class="link" disabled>Limpar histórico</button>
      <button id="quit" class="link">Sair do app</button>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
